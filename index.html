<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokémon GO 搜尋條件產生器</title>
<link rel="stylesheet" href="css/style.css" />
<!-- Google AdSense 廣告（尚未啟用，僅預留版位）啟用步驟：
     1) 到 https://www.google.com/adsense 申請帳號，通過審核後取得發布商 ID（格式如 ca-pub-1234567890123456）
     2) 移除下面整段外層的註解符號，並把 ca-pub-XXXXXXXXXXXXXXXX 換成你的發布商 ID
     3) 到 AdSense 後台為「上段/中段/下段」各建立一個廣告單元，記下各自的 data-ad-slot 編號
     4) 到下方三個 .ad-slot 區塊，把裡面對應的 ins 廣告程式碼一併取消註解，並填入正確的 client / slot 編號 -->
<!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
</head>
<body>
  <header class="app-header">
    <h1 id="header-title">Pokémon GO 搜尋條件產生器</h1>
    <p class="subtitle" id="header-subtitle">勾選你要的條件，自動組出遊戲搜尋欄可以用的語法字串</p>
  </header>

  <!-- 上段廣告版位 -->
  <div class="ad-slot" id="ad-slot-top" aria-hidden="true">
    <span class="ad-slot-label">廣告</span>
    <!--
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="0000000000"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
  </div>

  <main class="app-main">
    <section class="panel results-panel">
      <h2 id="results-heading">產生結果</h2>

      <div class="lang-row">
        <span class="lang-label">Page Language</span>
        <label class="radio-label">
          <input type="radio" name="page-lang" id="page-lang-zh" value="zh" checked />
          中文
        </label>
        <label class="radio-label">
          <input type="radio" name="page-lang" id="page-lang-en" value="en" />
          English
        </label>
      </div>

      <div class="lang-row">
        <span class="lang-label" id="game-lang-label">Game Language（搜尋語法用字）</span>
        <label class="radio-label">
          <input type="radio" name="game-lang" id="game-lang-zh" value="zh" checked />
          中文（例如：0防禦）
        </label>
        <label class="radio-label">
          <input type="radio" name="game-lang" id="game-lang-en" value="en" />
          English（e.g. 0defense）
        </label>
      </div>
      <p class="help-text lang-help" id="game-lang-help"></p>

      <div id="warnings"></div>
      <div id="results"></div>
      <div class="save-row">
        <input type="text" id="preset-name-input" />
        <button type="button" id="save-preset-btn"></button>
        <button type="button" id="reset-btn"></button>
      </div>
    </section>

    <section class="panel presets-panel">
      <h2 id="presets-heading"></h2>
      <ul id="preset-list"></ul>
      <div class="backup-row">
        <button type="button" id="export-btn"></button>
        <label class="import-label">
          <span id="import-label-text"></span>
          <input type="file" id="import-input" accept="application/json" hidden />
        </label>
      </div>
      <p class="help-text" id="presets-help"></p>
    </section>

    <!-- 中段廣告版位 -->
    <div class="ad-slot" id="ad-slot-mid" aria-hidden="true">
      <span class="ad-slot-label">廣告</span>
      <!--
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      -->
    </div>

    <form id="filter-form" class="panel form-panel"></form>
  </main>

  <!-- 下段廣告版位 -->
  <div class="ad-slot" id="ad-slot-bottom" aria-hidden="true">
    <span class="ad-slot-label">廣告</span>
    <!--
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="0000000000"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
  </div>

  <footer class="app-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/query-builder.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
